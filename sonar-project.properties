sonar.projectName=FactuX Frontend
# Version del analisis: el "codigo nuevo" de Sonar se mide desde el primer analisis de cada version.
# Subirla al cerrar una entrega reinicia la linea base.
sonar.projectVersion=1.0
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=node_modules/**,dist/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
